<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a8a">
<title>BEL Receiving Operations</title>
<style>
*{box-sizing:border-box;margin:0}
:root,[data-t=able]{--nav:#fff;--ntx:#4b5563;--nact:#4680ff;--nhov:#eef2f9;--ban:linear-gradient(120deg,#4680ff,#2d4f9e);--btx:#fff;--pr:#4680ff;--bg:#eef2f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ok:#10b981;--wa:#f59e0b;--er:#ef4444}
[data-t=navy]{--nav:#0f2a8a;--ntx:#dbe4ff;--nact:#2563eb;--nhov:#ffffff18;--ban:#fff;--btx:#111827;--pr:#2563eb;--bg:#f4f6fb}
[data-t=green]{--nav:#064e3b;--ntx:#d1fae5;--nact:#10b981;--nhov:#ffffff18;--ban:linear-gradient(120deg,#10b981,#047857);--btx:#fff;--pr:#059669;--bg:#f0fdf4}
[data-t=dark]{--nav:#111827;--ntx:#cbd5e1;--nact:#6366f1;--nhov:#ffffff14;--ban:#1f2937;--btx:#f9fafb;--pr:#6366f1;--bg:#0b1220;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--bd:#374151}
.mbox,.lbox,input,select,textarea{color:#111827}
body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4680ff,#1e3a8a);padding:16px}
.lbox{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px}
.lbox h1{font-size:22px;letter-spacing:2px;color:#0f2a8a;text-align:center}.lbox p{color:#6b7280;margin:4px 0 18px;font-size:12px;text-align:center}.lbox img{display:block;margin:0 auto 10px;width:110px;height:110px;border-radius:50%}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--pr);color:#fff}
.btn.g{background:#eef2ff;color:var(--pr)}.btn.r{background:#fee2e2;color:#b91c1c}.btn.s{padding:6px 10px;font-size:12px}
.err{color:var(--er);font-size:12px;margin-top:8px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--nav);color:var(--ntx);box-shadow:2px 0 12px #0002;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:20;transition:.25s}
.brand{padding:18px 16px;text-align:center;border-bottom:1px solid #8883}.brand img{width:76px;height:76px;border-radius:50%;background:#fff;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 10px #0003}.brand b{display:block;margin-top:8px}.brand small{opacity:.7;font-size:11px}
nav{flex:1;padding:10px;overflow:auto}
nav a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:8px;color:var(--ntx);cursor:pointer;font-weight:600;margin-bottom:2px}
nav a:hover{background:var(--nhov)}nav a.on{background:var(--nact);color:#fff}
nav i{font-style:normal;background:#8883;border-radius:10px;padding:1px 8px;font-size:11px}
.me{padding:14px;border-top:1px solid #8883;font-size:12px}.me button{margin-top:8px;width:100%;background:var(--nhov);color:var(--ntx)}
main{flex:1;margin-left:230px;min-width:0}
header{background:var(--ban);color:var(--btx);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h2{flex:1;font-size:18px}#menu{display:none;color:inherit;background:none;border:0;font-size:22px}
.role{background:#eff6ff;color:var(--pr);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.wrap{padding:20px;max-width:1100px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--c,var(--pr));color:#fff;border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 3px 10px #0002}
.st b{font-size:28px;display:block}.st span{font-size:11px;font-weight:700;color:#ffffffdd;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{color:var(--mu);font-size:11px;text-transform:uppercase}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar .sp{flex:1}
.rec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap}
.rec .kv{flex:1;min-width:200px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv small{display:block;color:var(--mu);font-size:10px;font-weight:700;text-transform:uppercase}
.rec img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bd{border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}.bd.p{background:#fef3c7;color:#92400e}.bd.o{background:#d1fae5;color:#065f46}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.empty{text-align:center;color:var(--mu);padding:30px}
#inst{position:fixed;left:12px;right:12px;bottom:12px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 8px 30px #0003;z-index:60;display:flex;gap:10px;align-items:center;max-width:460px;margin:auto}
#inst div{flex:1}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0}#menu{display:block}.wrap{padding:12px}}
</style></head><body>

<div id="login"><form class="lbox" onsubmit="return doLogin(event)">
<img class="logo"><h1>BEL RECEIVING</h1><p>Pending Activities Tracker</p>
<label>Username / Email</label><input id="lu" autocomplete="username" required>
<label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
<button class="btn" style="width:100%;margin-top:16px">Sign In</button><div class="err" id="le"></div></form></div>

<div id="app" class="hide">
<aside id="side"><div class="brand"><img class="logo"><b id="bn"></b><small id="br"></small></div>
<nav id="nav"></nav>
<div class="me"><div id="who"></div><button class="btn s" onclick="auth.signOut()">Logout</button></div></aside>
<main><header><button id="menu" onclick="side.classList.toggle('open')">☰</button><h2 id="ttl">Dashboard</h2><span class="role" id="role"></span><img class="logo" style="width:36px;height:36px;border-radius:50%;background:#fff"></header>
<div class="wrap" id="view"></div></main></div>

<div id="inst" class="hide"><div><b>Install BEL Receiving</b><br><small>Add this app to your device</small></div>
<button class="btn g s" onclick="inst.classList.add('hide')">Later</button><button class="btn s" id="ibtn">Install</button></div>

const TH={able:'Material Blue',navy:'Navy Classic',green:'Emerald',dark:'Dark Night'};
function setTheme(t){document.documentElement.dataset.t=t;try{localStorage.setItem('th',t)}catch(e){}}
try{setTheme(localStorage.getItem('th')||'able')}catch(e){setTheme('able')}
db.ref('settings/theme').on('value',s=>{if(s.val()&&TH[s.val()]){setTheme(s.val());render()}},()=>{});
document.querySelectorAll('.logo').forEach(i=>i.src=LOGO);
['icon','apple-touch-icon'].forEach(r=>{const l=document.createElement('link');l.rel=r;l.href=LOGO;document.head.appendChild(l)});
function rowsOf(k,onlyPending){return arr(k).filter(r=>!onlyPending||r.status!=='sorted').sort((a,b)=>a.ts-b.ts).map(r=>{const o={'Added On':new Date(r.ts).toLocaleString()};M[k].f.forEach(([n,l,t])=>{if(t!='photo')o[l]=(t=='number'&&r[n]!==''&&r[n]!=null)?+r[n]:(r[n]??'')});o.Status=r.status=='sorted'?'Sorted':'Pending';o['Sorted By']=r.sortedBy||'';o['Added By']=(r.by||'').replace('@bel-receiving.app','');return o})}
const sheet=rows=>XLSX.utils.json_to_sheet(rows.length?rows:[{'Info':'No records'}]);
const stamp=()=>new Date().toISOString().slice(0,10);
function exportOne(k){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheet(rowsOf(k,false)),M[k].t.slice(0,31));XLSX.writeFile(wb,`BEL_${M[k].t.replace(/[^A-Za-z0-9]+/g,'_')}_${stamp()}.xlsx`)}
function exportAll(){const wb=XLSX.utils.book_new();Object.keys(M).forEach(k=>XLSX.utils.book_append_sheet(wb,sheet(rowsOf(k,true)),M[k].t.slice(0,31)));XLSX.writeFile(wb,`BEL_Master_Pending_${stamp()}.xlsx`)}
function themeCard(){const c=document.documentElement.dataset.t;return `<div class="card"><h3>🎨 Theme (changes for all users)</h3><div class="act">${Object.keys(TH).map(t=>`<button class="btn ${c==t?'':'g'} s" onclick="db.ref('settings/theme').set('${t}')">${TH[t]}</button>`).join('')}</div></div>`}

const toEmail=u=>{u=u.trim().toLowerCase();return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)?u:u.replace(/@/g,'_')+'@bel-receiving.app'};

try{await auth.signInWithEmailAndPassword(toEmail($('lu').value),$('lp').value)}catch(x){$('le').textContent='Invalid username or password'}return false}
auth.onAuthStateChanged(u=>{user=u;
if(!u){$('login').classList.remove('hide');$('app').classList.add('hide');return}
isAdmin=u.email===ADMIN_EMAIL;$('login').classList.add('hide');$('app').classList.remove('hide');
$('who').textContent=u.email.replace('@bel-receiving.app','');$('role').textContent=isAdmin?'Admin':'User';$('bn').textContent=$('who').textContent.toUpperCase();$('br').textContent=isAdmin?'Administrator':'Receiving Team';
Object.keys(M).forEach(k=>db.ref('data/'+k).on('value',s=>{D[k]=s.val()||{};render()}));render()});

function render(){if(!user)return;
$('nav').innerHTML=`<a class="${page=='dash'?'on':''}" onclick="go('dash')">📊 Dashboard</a>`+Object.keys(M).map(k=>`<a class="${page==k?'on':''}" onclick="go('${k}')">${M[k].t}<i>${pend(k).length}</i></a>`).join('');
$('ttl').textContent=page=='dash'?'Dashboard':M[page].t;
$('view').innerHTML=page=='dash'?dash():list(page)}
function go(p){page=p;showSorted=false;side.classList.remove('open');render()}

function dash(){
const g={};pend('grn').forEach(r=>g[r.date]=(g[r.date]||0)+num(r.n));
const inv=pend('inv'),sum=(a,f)=>a.reduce((s,r)=>s+num(r[f]),0);
const sf=sum(inv.filter(r=>r.kind=='SFC'),'n'),ck=sum(inv.filter(r=>r.kind=='Checking'),'n');
const bay=pend('bay'),loc=l=>bay.filter(r=>r.loc==l);
return `<div class="bar"><button class="btn" onclick="exportAll()">⬇ Master Excel – All Pending</button></div><div class="grid">${Object.keys(M).map((k,i)=>`<div class="st" style="--c:${COL[i]}" onclick="go('${k}')"><b>${pend(k).length}</b><span>${M[k].t}</span></div>`).join('')}</div>
<div class="card"><h3>GRN invoices pending by entry date</h3>${Object.keys(g).length?`<table><tr><th>Entry Date</th><th>Invoices</th></tr>${Object.keys(g).sort().map(d=>`<tr><td>${esc(d)}</td><td><b>${g[d]}</b></td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${sum(pend('grn'),'n')}</b></td></tr></table>`:'<div class="empty">No pending GRN invoices</div>'}</div>
<div class="grid"><div class="st" style="--c:#f59e0b"><b>${sf}</b><span>SFC invoice stickers pending</span></div><div class="st" style="--c:#ef4444"><b>${ck}</b><span>Checking invoice stickers pending</span></div></div>
<div class="card"><h3>Bay &amp; R15 pending goods</h3><table><tr><th>Location</th><th>Entries</th><th>Boxes</th><th>Fabric Rolls</th></tr>${['Bay','R15'].map(l=>`<tr><td>${l}</td><td>${loc(l).length}</td><td>${sum(loc(l),'boxes')}</td><td>${sum(loc(l),'rolls')}</td></tr>`).join('')}</table></div>${isAdmin?themeCard():''}`}

function list(k){const m=M[k];let rows=arr(k).filter(r=>showSorted?r.status==='sorted':r.status!=='sorted').sort((a,b)=>b.ts-a.ts);
return `<div class="bar"><button class="btn" onclick="openForm('${k}')">+ Add</button>
<button class="btn g" onclick="showSorted=!showSorted;render()">${showSorted?'Show Pending':'Show Sorted'}</button>
<button class="btn g" onclick="exportOne('${k}')">⬇ Excel (with status)</button><span class="sp"></span><small>${rows.length} ${showSorted?'sorted':'pending'}</small></div>`+
(rows.length?rows.map(r=>rec(k,r)).join(''):`<div class="empty">Nothing ${showSorted?'sorted':'pending'}</div>`)}
function rec(k,r){const m=M[k],isOwner=r.by===user.email,canEdit=isAdmin||(!m.adminOnly&&isOwner),canSort=isAdmin||(!m.adminOnly&&isOwner),pics=photosOf(r);
return `<div class="rec">${pics.map(p=>`<img src="${p}" onclick="zoom('${p}')">`).join('')}<div class="kv">${m.f.filter(f=>f[2]!='photo').map(f=>`<div><small>${f[1]}</small>${esc(r[f[0]])||'-'}</div>`).join('')}<div><small>Status</small><span class="bd ${r.status=='sorted'?'o':'p'}">${r.status=='sorted'?'Sorted by '+esc(r.sortedBy||''):'Pending'}</span></div><div><small>Added By</small>${esc((r.by||'').replace('@bel-receiving.app',''))}</div></div>
<div class="act">${canSort?`<button class="btn g s" onclick="toggle('${k}','${r.id}')">${r.status=='sorted'?'Reopen':'Mark Sorted'}</button>`:''}${canEdit?`<button class="btn g s" onclick="openForm('${k}','${r.id}')">Edit</button>`:''}${isAdmin?`<button class="btn r s" onclick="del('${k}','${r.id}')">Delete</button>`:''}</div></div>`}
// Shortages: users may add entries; only admin can edit / sort / delete. Others: users may delete too.
function toggle(k,id){const r=D[k][id];
if(r.status=='sorted'){db.ref(`data/${k}/${id}`).update({status:'pending',sortedBy:null});return}
const name=prompt('Sorted by (enter name):','');if(name===null)return;
db.ref(`data/${k}/${id}`).update({status:'sorted',sortedBy:name.trim()||user.email.replace('@bel-receiving.app','')})}
function del(k,id){if(confirm('Delete this entry?'))db.ref(`data/${k}/${id}`).remove()}
function zoom(s){const d=document.createElement('div');d.className='modal';d.onclick=()=>d.remove();d.innerHTML=`<img src="${s}" style="max-width:100%;max-height:90vh;border-radius:10px">`;document.body.appendChild(d)}

function openForm(k,id){photos=[];editing={k,id};const r=id?D[k][id]:{};if(r)photos=photosOf(r).slice();
const f=M[k].f.map(([n,l,t,req])=>{let i;
if(t=='photo')i=`<div class="act"><label class="btn g s" style="display:inline-block;margin:0;cursor:pointer">📷 Camera<input type="file" accept="image/*" capture="environment" hidden onchange="pick(this)"></label><label class="btn g s" style="display:inline-block;margin:0;cursor:pointer">🖼 Add Photo<input type="file" accept="image/*" hidden onchange="pick(this)"></label></div><div id="pv" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div>`;
else if(t.startsWith('select'))i=`<select id="f_${n}">${t.slice(7).split(',').map(o=>`<option ${r[n]==o?'selected':''}>${o}</option>`).join('')}</select>`;
else if(t=='textarea')i=`<textarea id="f_${n}" rows="3">${esc(r[n])}</textarea>`;
else i=`<input id="f_${n}" type="${t}" ${req?'required':''} value="${esc(r[n]||(t=='date'&&!id?new Date().toISOString().slice(0,10):''))}">`;
return `<label>${l}${req?' *':''}</label>${i}`}).join('');
const d=document.createElement('div');d.className='modal';d.id='mod';
d.innerHTML=`<form class="mbox" onsubmit="return save(event)"><h3 style="margin-bottom:6px">${id?'Edit':'Add'} – ${M[k].t}</h3>${f}<div class="bar" style="margin:18px 0 0"><button class="btn">Save</button><button type="button" class="btn g" onclick="mod.remove()">Cancel</button></div></form>`;
document.body.appendChild(d);renderPv()}
function pick(el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.6));renderPv();el.value=''};im.src=URL.createObjectURL(f)}
function renderPv(){const p=$('pv');if(!p)return;p.innerHTML=photos.map((p2,i)=>`<div style="position:relative"><img src="${p2}" style="width:70px;height:70px;object-fit:cover;border-radius:8px"><button type="button" onclick="photos.splice(${i},1);renderPv()" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-weight:700;cursor:pointer">×</button></div>`).join('')}
async function save(e){e.preventDefault();const {k,id}=editing,o={};
M[k].f.forEach(([n,,t])=>{o[n]=t=='photo'?photos.slice():($('f_'+n).value||'')});
try{if(id)await db.ref(`data/${k}/${id}`).update(o);else await db.ref(`data/${k}`).push({...o,status:'pending',by:user.email,ts:Date.now()});$('mod').remove()}
catch(x){alert('Save failed: '+x.message)}return false}

// PWA install prompt
const man={name:'BEL Receiving Operations',short_name:'BEL Receiving',start_url:'.',display:'standalone',background_color:'#0f2a8a',theme_color:'#0f2a8a',icons:[{src:LOGO,sizes:'256x256',type:'image/jpeg',purpose:'any'}]};
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(ml);
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').classList.remove('hide')});
$('ibtn').onclick=async()=>{$('inst').classList.add('hide');if(dp){dp.prompt();dp=null}};
</script></body></html>
